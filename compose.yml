services:
  server:
    build:
      context: .
    env_file:
      - .env
    ports:
      - 3000:3000
    volumes:
      - ./src:/usr/app/src
    depends_on:
      - db:
    db:
      image: mysql
      restart: always
      env_file:
        - .env
      ports:
        - 3306:3306
      volumes:
        - my-db:/var/lib/mysql

volumes:
  my-db:
